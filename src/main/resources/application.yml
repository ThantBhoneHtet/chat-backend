server:
    port:  ${PORT:8080}
logging:
    level:
        org:
            springframework:
                security: DEBUG
    
firebase:
    project:
        id: ${FIREBASE_PROJECT_ID}
    credentials:
        path: ${FIREBASE_CREDENTIALS_PATH:classpath:chat-app-service-acc-key.json}

spring:
    application:
        name: chat-app
    cloud:
        gcp:
            firestore:
                enabled: true
                project-id: ${firebase.project.id}
                credentials:
                    location: file:${firebase.credentials.path}
            project-id: ${firestore.project.id}
            credentials:
                location: file:${firebase.credentials.path}
            secretmanager:
                enabled: false
    autoconfigure:
        exclude:
            - com.google.cloud.spring.autoconfigure.secretmanager.GcpSecretManagerAutoConfiguration
    security:
        # default user and pw
        user:
            name: ${SPRING_SECURITY_USER_NAME}
            password: ${SPRING_SECURITY_USER_PASSWORD}
        oauth2:
            client:
                registration:
                    github:
                        client-id: ${GITHUB_CLIENT_ID}
                        client-secret: ${GITHUB_CLIENT_SECRET}
                        # scope of which data to be retrieved
                        scope:
                            - read:user
                            - user:email
                        redirect-uri: "http://localhost:8080/login/oauth2/code/github"
                    google:
                        client-id: ${GOOGLE_CLIENT_ID}
                        client-secret: ${GOOGLE_CLIENT_SECRET}
    app:
        jwtSecret: ${JWT_SECRET}
        jwtExpirationMs: 10000000

aws:
    s3:
        bucket-name: tbh-testing
        region: ap-southeast-1
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}